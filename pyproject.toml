[project]
name = "loosy-goose"
version = "0.1.0"
description = "Lossy text compression for LLM context compaction via eigen-dimension semantic spaces."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sebastian Frazier", email = "sebastianfrazier26@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
]

[project.scripts]
loosy-goose = "loosy_goose.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "huggingface-hub>=1.30.0",
    "matplotlib>=3.11.1",
    "mypy>=2.3.1",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "scipy-stubs>=1.18.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
